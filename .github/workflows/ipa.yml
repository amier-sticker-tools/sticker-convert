name: ipa
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: build
        run: |
          mkdir -p src app/StickerBridge.app
          cat > src/main.swift <<'SRC_EOF'
          import UIKit
          import Compression

          func le16(_ d: Data, _ o: Int) -> Int { Int(d[o]) | Int(d[o+1]) << 8 }
          func le32(_ d: Data, _ o: Int) -> Int { le16(d, o) | le16(d, o+2) << 16 }

          func unzip(_ d: Data) -> [String: Data] {
              var out: [String: Data] = [:]
              var e = d.count - 22
              while e >= 0 && le32(d, e) != 0x06054b50 { e -= 1 }
              if e < 0 { return out }
              let n = le16(d, e + 10); var p = le32(d, e + 16)
              for _ in 0..<n {
                  if p + 46 > d.count || le32(d, p) != 0x02014b50 { break }
                  let method = le16(d, p + 10), cs = le32(d, p + 20), us = le32(d, p + 24)
                  let nl = le16(d, p + 28), el = le16(d, p + 30), cl = le16(d, p + 32), lo = le32(d, p + 42)
                  let name = String(data: d.subdata(in: p+46..<p+46+nl), encoding: .utf8) ?? ""
                  let lnl = le16(d, lo + 26), lel = le16(d, lo + 28), ds = lo + 30 + lnl + lel
                  let raw = d.subdata(in: ds..<ds+cs)
                  if method == 0 { out[name] = raw }
                  else if method == 8 {
                      var dst = [UInt8](repeating: 0, count: us + 16)
                      let r = raw.withUnsafeBytes { s in compression_decode_buffer(&dst, dst.count, s.bindMemory(to: UInt8.self).baseAddress!, cs, nil, COMPRESSION_ZLIB) }
                      out[name] = Data(dst[0..<r])
                  }
                  p += 46 + nl + el + cl
              }
              return out
          }

          @main
          class App: UIResponder, UIApplicationDelegate {
              var window: UIWindow?
              func application(_ a: UIApplication, didFinishLaunchingWithOptions o: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                  window = UIWindow(frame: UIScreen.main.bounds)
                  window?.rootViewController = VC(); window?.makeKeyAndVisible(); return true
              }
              func application(_ a: UIApplication, open url: URL, options: [UIApplication.OpenURLOptionsKey: Any] = [:]) -> Bool {
                  (window?.rootViewController as? VC)?.start(url.absoluteString); return true
              }
          }

          class VC: UIViewController {
              let tf = UITextField(), msg = UILabel()
              let base = "https://contact-bot.amier8627.workers.dev/z/"
              override func viewDidLoad() {
                  super.viewDidLoad()
                  view.backgroundColor = UIColor(red: 0.06, green: 0.07, blue: 0.125, alpha: 1)
                  let iv = UIImageView(image: UIImage(named: "pic.jpg") ?? UIImage(contentsOfFile: Bundle.main.path(forResource: "pic", ofType: "jpg") ?? ""))
                  iv.contentMode = .scaleAspectFill; iv.layer.cornerRadius = 60; iv.clipsToBounds = true
                  iv.widthAnchor.constraint(equalToConstant: 120).isActive = true; iv.heightAnchor.constraint(equalToConstant: 120).isActive = true
                  let name = UILabel(); name.text = "@T1UU1"; name.textColor = .white; name.font = .boldSystemFont(ofSize: 22)
                  let sub = UILabel(); sub.text = "حوّل باك الاستيكرز للواتساب بضغطة"; sub.textColor = UIColor(white: 0.62, alpha: 1); sub.font = .systemFont(ofSize: 14)
                  tf.attributedPlaceholder = NSAttributedString(string: "الصق اللينك هنا", attributes: [.foregroundColor: UIColor(white: 0.45, alpha: 1)])
                  tf.textColor = .white; tf.backgroundColor = UIColor(red: 0.105, green: 0.125, blue: 0.21, alpha: 1)
                  tf.layer.cornerRadius = 16; tf.autocapitalizationType = .none; tf.autocorrectionType = .no; tf.keyboardType = .URL
                  tf.leftView = UIView(frame: CGRect(x: 0, y: 0, width: 16, height: 1)); tf.leftViewMode = .always
                  tf.heightAnchor.constraint(equalToConstant: 52).isActive = true
                  let bt = UIButton(type: .system); bt.setTitle("حوّل للواتساب", for: .normal); bt.setTitleColor(.white, for: .normal)
                  bt.titleLabel?.font = .boldSystemFont(ofSize: 17); bt.backgroundColor = UIColor(red: 0.145, green: 0.827, blue: 0.4, alpha: 1)
                  bt.layer.cornerRadius = 16; bt.heightAnchor.constraint(equalToConstant: 54).isActive = true
                  bt.addTarget(self, action: #selector(tap), for: .touchUpInside)
                  msg.textColor = UIColor(white: 0.8, alpha: 1); msg.numberOfLines = 0; msg.textAlignment = .center
                  let st = UIStackView(arrangedSubviews: [iv, name, sub, tf, bt, msg]); st.axis = .vertical; st.alignment = .fill; st.spacing = 14
                  st.setCustomSpacing(30, after: sub); st.arrangedSubviews[0].setContentHuggingPriority(.required, for: .horizontal)
                  iv.setContentCompressionResistancePriority(.required, for: .horizontal)
                  st.translatesAutoresizingMaskIntoConstraints = false; view.addSubview(st)
                  for v in [name, sub] { v.textAlignment = .center }
                  NSLayoutConstraint.activate([st.leadingAnchor.constraint(equalTo: view.leadingAnchor, constant: 28), st.trailingAnchor.constraint(equalTo: view.trailingAnchor, constant: -28), st.topAnchor.constraint(equalTo: view.safeAreaLayoutGuide.topAnchor, constant: 56)])
                  iv.superview?.layoutIfNeeded()
                  st.alignment = .fill
                  iv.contentMode = .scaleAspectFill
              }
              @objc func tap() { start(tf.text ?? "") }
              func say(_ s: String) { DispatchQueue.main.async { self.msg.text = s } }
              func start(_ link: String) {
                  let t = link.trimmingCharacters(in: CharacterSet(charactersIn: "/ \n\t"))
                  let id = String(t.split(separator: "/").last ?? "")
                  let ok = id.range(of: "^[a-z0-9]{6,40}$", options: .regularExpression) != nil
                  if !ok { say("اللينك ده مش صح. انسخه من البوت تاني."); return }
                  say("بنحمّل الباك...")
                  URLSession.shared.dataTask(with: URL(string: base + id)!) { d, r, _ in
                      guard let d = d, (r as? HTTPURLResponse)?.statusCode == 200 else { self.say("الباك ده انتهى أو مش موجود. اطلبه من البوت تاني."); return }
                      DispatchQueue.main.async { self.send(id, unzip(d)) }
                  }.resume()
              }
              func send(_ id: String, _ f: [String: Data]) {
                  let names = f.keys.filter { $0.hasSuffix(".webp") }.sorted { (Int($0.dropLast(5)) ?? 0) < (Int($1.dropLast(5)) ?? 0) }
                  guard let tray = f["tray.png"], names.count >= 3 else { say("الباك مش مكتمل (لازم 3 استيكرز على الأقل)."); return }
                  let anim = f[names[0]].map { String(data: $0.prefix(200), encoding: .isoLatin1)?.contains("ANIM") ?? false } ?? false
                  var st: [[String: Any]] = []
                  for n in names.prefix(30) { st.append(["image_data": f[n]!.base64EncodedString(), "emojis": ["😀"], "accessibility_text": ""]) }
                  var j: [String: Any] = ["identifier": id, "name": String(data: f["title.txt"] ?? Data(), encoding: .utf8) ?? "Stickers",
                                          "publisher": "@T1UU1", "tray_image": tray.base64EncodedString(), "stickers": st]
                  if anim { j["animated_sticker_pack"] = true }
                  guard let wa = URL(string: "whatsapp://stickerPack"), UIApplication.shared.canOpenURL(wa), let data = try? JSONSerialization.data(withJSONObject: j) else { say("واتساب مش متثبت."); return }
                  UIPasteboard.general.setItems([["net.whatsapp.third-party.sticker-pack": data]], options: [.localOnly: true, .expirationDate: Date(timeIntervalSinceNow: 60)])
                  UIApplication.shared.open(wa)
              }
          }
          SRC_EOF
          cat > app/StickerBridge.app/Info.plist <<'SRC_EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleExecutable</key><string>StickerBridge</string>
          <key>CFBundleIdentifier</key><string>com.t1uu1.stickerbridge</string>
          <key>CFBundleName</key><string>T1UU1 Stickers</string>
          <key>CFBundleDisplayName</key><string>T1UU1 Stickers</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>CFBundleShortVersionString</key><string>1.0</string>
          <key>CFBundleVersion</key><string>1</string>
          <key>MinimumOSVersion</key><string>14.0</string>
          <key>UIDeviceFamily</key><array><integer>1</integer></array>
          <key>UILaunchScreen</key><dict/>
          <key>UIUserInterfaceStyle</key><string>Dark</string>
          <key>LSApplicationQueriesSchemes</key><array><string>whatsapp</string></array>
          <key>CFBundleURLTypes</key><array><dict><key>CFBundleURLSchemes</key><array><string>stickerbridge</string></array></dict></array>
          <key>CFBundleIcons</key><dict><key>CFBundlePrimaryIcon</key><dict><key>CFBundleIconFiles</key><array><string>Icon</string></array></dict></dict>
          </dict></plist>
          SRC_EOF
          echo '' | base64 -d > app/StickerBridge.app/pic.jpg
          echo '' | base64 -d > "app/StickerBridge.app/Icon@2x.png"
          echo '' | base64 -d > "app/StickerBridge.app/Icon@3x.png"
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          swiftc -parse-as-library -O -sdk "$SDK" -target arm64-apple-ios14.0 src/main.swift -o app/StickerBridge.app/StickerBridge
          mkdir Payload && cp -R app/StickerBridge.app Payload/
          zip -qr stickerbridge.ipa Payload
          ls -la stickerbridge.ipa
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ios-latest -y --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create ios-latest stickerbridge.ipa --repo "$GITHUB_REPOSITORY" --title "StickerBridge iOS" --notes "Unsigned IPA, sideload with AltStore or Sideloadly"
